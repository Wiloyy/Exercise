<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1 id="text">OVERWATCH Quiz!!</h1>
    <p id="lilText">Clique em iniciar para começar o quiz. Espero que você goste! :)</p>
    <p id="text1"></p>

    <div class="questionResponses" style="display: none;">
        <button class="options" id="optionA">A</button>
        <button class="options" id="optionB">B</button>
        <button class="options" id="optionC">C</button>
        <button class="options" id="optionD">D</button>
        <button  id="next">Próximo</button>
        <button  id="back">Volte para uma pergunta anterior</button>
        <button  id="backToTheSame">Volte para a mesma pergunta</button>
    </div>
    <button  id="start">Início</button>
    <button id="reset">Reset</button>

    <script type="module" src="index.js"></script>
</body>

</html>
