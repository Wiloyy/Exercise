<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1 id="text">OVERWATCH Quiz!!</h1>
    <p id="lilText">Clique em iniciar para começar o quiz. Espero que você goste! :)</p>
    <p id="text1"></p>

    <div class="questionResponses" style="display: none;">
        <button class="options" id="response1">A</button>
        <button class="options" id="response2">B</button>
        <button class="options" id="response3">C</button>
        <button class="options" id="response4">D</button>
        <button class="options" id="next">Próximo</button>
        <button class="options" id="reset">Reset</button>
        <button class="options" id="back">Back</button>
    </div>
    <button class="options" id="start">Início</button>

    <script type="module" src="index.js"></script>
</body>

</html>
