<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container2">
        <h1>Calculator</h1>
    </div>
    <p id="text"></p>
    <div class="container">
        <button class="buttons" id="button1">1</button>
        <button class="buttons" id="button2">2</button>
        <button class="buttons" id="button3">3</button>
        <button class="buttons" id="plus">+</button>
    
        <button class="buttons" id="button4">4</button>
        <button class="buttons" id="button5">5</button>
        <button class="buttons" id="button6">6</button>
        <button class="buttons" id="minus">-</button>
    
        <button class="buttons" id="button7">7</button>
        <button class="buttons" id="button8">8</button>
        <button class="buttons" id="button9">9</button>
        <button class="buttons" id="multiplication">x</button>
    
        <button class="buttons" id="button0">0</button>
        <button class="buttons" id="division">:</button>
        <button id="equals">=</button>
        <button id="reset">C</button>
    </div>

    <script src="index.js"></script>
</body>

</html>
